version: '3.9'

services:
  ecis-database:
    image: postgres:18.4
    container_name: ecis-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      -  ecis-database-data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - ecis-network

  ecis-test-database:
    image: postgres:18.4
    container_name: ecis-test-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: always
    ports:
      - "15432:5432"
    volumes:
      -  ecis-test-database-data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d

  ecis-maildev:
    image: maildev/maildev:latest
    container_name: ecis-maildev
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:1080:1080" # Web UI
    restart: unless-stopped
    networks: 
      - ecis-network


volumes:
  ecis-database-data:
  ecis-test-database-data:

networks:
  ecis-network:
