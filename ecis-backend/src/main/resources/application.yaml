server:
  port: 8082
  tomcat:
    threads:
      max: 60
      min-spare: 5

spring:
  application:
    name: ECIS backend
  profiles:
    active: dev
  datasource:
    jdbc-url: jdbc:postgresql://localhost:5432/ecis
    username: ecis_apl
    password: ecis_apl
    driver-class-name: org.postgresql.Driver
  hikari:
    maximum-pool-size: 10
    minimum-idle: 3
    connection-timeout: 20000
    idle-timeout: 300000
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
  threads:
    virtual:
      enabled: true
  quartz:
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 5
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml
    liquibaseSchema: public
    url: jdbc:postgresql://localhost:5432/ecis
    user: ecis
    password: ecis
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: true
  main:
    log-startup-info: true

