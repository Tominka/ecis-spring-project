<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="#{email.password-reset.title}">Reset hesla</title>
  </head>
  <body>
    <h2 th:text="#{email.password-reset.heading}">Reset hesla</h2>

    <p th:text="#{email.password-reset.instruction}">
      Pro změnu hesla klikněte na odkaz:
    </p>

    <a th:href="${resetUrl}" th:text="#{email.password-reset.button}">
      Resetovat heslo
    </a>

    <p th:text="#{email.password-reset.expiration(${expirationMinutes})}"></p>
  </body>
</html>
