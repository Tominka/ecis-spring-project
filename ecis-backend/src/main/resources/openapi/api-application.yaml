openapi: 3.0.1
info:
  title: Child API
  description: API definiton for children
  version: 1.0.0
tags:
  -
    name: Application
    description: APIs for managing application in system
servers:
  - url: /api/v1
    description: Local development server

paths:
  /application:
    get:
      tags:
        - Application
      operationId: getAllApplications
      security:
        - bearerAuth: []
        - campContext: []
      responses:
        "200":
          description: Fetched applications in specified camp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationOverviewDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
    post:
      tags:
        - Application
      operationId: createApplication
      security:
        - bearerAuth: []
        - campContext: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreateDto"
      responses:
        "201":
          description: Application created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /application/search:
    post:
      tags:
        - Application
      operationId: searchApplications
      security:
        - bearerAuth: []
        - campContext: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "./child.yaml#/components/schemas/ChildFilterDto"
              
      responses:
        "200":
          description: Fetched applications in specified camp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationOverviewDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /application/{id}:
    get:
      tags:
        - Application
      operationId: getApplicationById
      security:
        - bearerAuth: []
        - campContext: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Fetched application by id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /application/{id}/document/{documentId}/content:
    get:
      tags:
        - Application
      operationId: getApplicationDocumentContentById
      security:
        - bearerAuth: []
        - campContext: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Fetched application document by id
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
components:
  schemas:
    ApplicationOverviewDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        child:
          $ref: "./child.yaml#/components/schemas/ChildDto"
        documentCount:
          type: integer
          format: int64
        canceledAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ApplicationDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        child:
          $ref: "./child.yaml#/components/schemas/ChildDto"
        parents:
          type: array
          items:
            $ref: "./parent.yaml#/components/schemas/ParentDto"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationDocumentDto"
        canceledAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int32

    ApplicationCreateDto:
      type: object
      required:
        - child
        - parents
      properties:
        child:
          $ref: "./child.yaml#/components/schemas/ChildDto"
        parents:
          type: array
          items:
            $ref: "./parent.yaml#/components/schemas/ParentDto"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationDocumentCreateDto"

    ApplicationDocumentCreateDto:
      type: object
      required:
        - filename
        - data
      properties:
        filename:
          type: string
          maxLength: 510
          pattern: '^.+\.[a-zA-Z0-9]+$'
        data:
          type: string
          format: byte

    ApplicationDocumentDto:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        fileSize:
          type: string
        # status:
        #   type: string

    LovDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string

    DeleteDto:
      type: object
      properties:
        version:
          type: integer
          format: int32

    ErrorDto:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
        timestamp:
          type: string

  securitySchemes:
    campContext:
      type: apiKey
      in: header
      name: X-Camp-Id
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
