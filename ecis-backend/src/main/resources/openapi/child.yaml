openapi: 3.0.1
info:
  title: Child API
  description: API definiton for children
  version: 1.0.0
tags:
  -
    name: Children
    description: APIs for managing children in system
servers:
  - url: /api/v1
    description: Local development server

paths:
  /child:
    get:
      tags:
        - Children
      operationId: getAllChildren
      security:
        - bearerAuth: []
        - campContext: []
      responses:
        "200":
          description: Fetched children in specified camp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChildDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
  /child/lov:
    get:
      tags:
        - Children
      operationId: getAllChildrenLov
      security:
        - bearerAuth: []
        - campContext: []
      responses:
        "200":
          description: Fetched children LOV in specified camp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LovDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
components:
  schemas:
    ChildDto:
      type: object
      required:
        - name
        - surname
        - address
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 255
        surname:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 510
        birthdate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
        version:
          type: integer
          format: int32

    LovDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string

    ErrorDto:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
        timestamp:
          type: string

  securitySchemes:
    campContext:
      type: apiKey
      in: header
      name: X-Camp-Id
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
