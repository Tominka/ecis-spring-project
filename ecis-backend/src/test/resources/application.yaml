spring:
  application:
    name: ECIS backend
  profiles:
    active: test
  datasource:
    jdbc-url: jdbc:postgresql://localhost:15432/ecis
    username: ecis_apl
    password: ecis_apl
    driver-class-name: org.postgresql.Driver
    
  liquibase:
    enabled: true
    jdbc-url: jdbc:postgresql://localhost:15432/ecis
    username: ecis
    password: ecis
    driver-class-name: org.postgresql.Driver
    change-log: classpath:db/changelog/changelog-master.xml
