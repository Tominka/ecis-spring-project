server:
  port: 8082

spring:
  application:
    name: ECIS backend
  profiles:
    active: test
  datasource:
    jdbc-url: jdbc:postgresql://localhost:15432/ecis
    username: ecis_apl
    password: ecis_apl
    driver-class-name: org.postgresql.Driver
    
  liquibase:
    enabled: true
    jdbc-url: jdbc:postgresql://localhost:15432/ecis
    username: ecis
    password: ecis
    driver-class-name: org.postgresql.Driver
    change-log: classpath:db/changelog/changelog-master.xml
    liquibaseSchema: public

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  main:
    log-startup-info: true

springdoc:
  api-docs:
    enabled: false

ecis:
  app:
    displayAppName: TestApp
    url: http://localhost:4200
    password:
      resetUrl: "http://localhost:4200/password-reset"
      resetMinutesValid: 20
      resetMinutesNextWait: 5
      minLength: 16
  login:
    enableAttemptProtection: true
    enablePasswordExpiration: true
    passwordExpirationTime: 90
    maxAttempts: 5
    blockTime: 300
  jwt:
    access:
      secretKey: afdssiojsdaoziufhiufhisudkjhzsidukjkudszhfwiuzghwqiuwqkzdqw
      validity: 900
    refresh:
      secretKey: afdssiojsdaoziufhiufhisudkjhzsidukjkudszhfwiuzghwqiuwqkzdqwsdadadadadsad
      validity: 86400
  audit:
    defaultAuditor: SYSTEM
  storage:
    directory: "storage"
  # mail:
  #   host: smtp.example.com
  #   port: 587
  #   username: ${MAIL_USERNAME}
  #   password: ${MAIL_PASSWORD}
  #   from: noreply@example.com

testing: true