openapi: 3.0.1
info:
  title: Env API
  description: API definiton for app enviroment
  version: 1.0.0
tags:
  -
    name: Env
    description: APIs for system environment
servers:
  - url: /api/v1
    description: Local development server

paths:
  /env:
    get:
      tags:
        - Env
      operationId: getAppEnv
      security:
        - apiKeyContext: []
      responses:
        "200":
          description: Fetched app environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvDto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

components:
  schemas:
    EnvDto:
      type: object
      required:
        - version
        - type
      properties:
        version:
          type: string
        type:
            $ref: "#/components/schemas/EnvTypeEnum"

    EnvTypeEnum:
      enum:
        - DEV
        - TEST
        - PROD
  
    ErrorDto:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
        timestamp:
          type: string

  securitySchemes:
    apiKeyContext:
      type: apiKey
      in: header
      name: X-API-Key