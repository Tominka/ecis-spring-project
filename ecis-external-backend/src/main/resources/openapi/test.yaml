openapi: 3.0.1
info:
  title: Env API
  description: API definiton for app enviroment
  version: 1.0.0
tags:
  -
    name: Test
    description: APIs for test connection
servers:
  - url: /api/ext/v1
    description: Local development server

paths:
  /test:
    get:
      tags:
        - Test
      operationId: getTestResponse
      security:
        - apiKeyContext: []
      responses:
        "200":
          description: getTestResponse
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"

components:
  schemas:  
    ErrorDto:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
        timestamp:
          type: string

  securitySchemes:
    apiKeyContext:
      type: apiKey
      in: header
      name: X-API-Key